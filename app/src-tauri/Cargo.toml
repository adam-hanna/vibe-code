[package]
name = "vibe-desktop"
version = "0.1.0"
description = "The vibe desktop app: window, tray, and the process that does the work"
authors = ["Adam Hanna"]
edition = "2021"
# Raised from 1.77.2 for iroh-base 1.3 (the device key, #341), which declares
# 1.91. CI and the release workflow build on stable, so neither moves.
rust-version = "1.91"

[lib]
# Tauri's mobile targets need a cdylib and the desktop binary needs a lib to call
# into. `_lib` because a lib and a bin cannot share a name.
name = "vibe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

# The native directory chooser behind the Launch form's repository field (#189).
# It is the one place the window is allowed to learn a path it did not already
# hold, and it launches nothing: the OS draws the dialog, a person drives it, and
# what comes back is a string. `dialog:allow-open` is the only permission granted
# in `capabilities/default.json` - `save`, `message`, `ask` and `confirm` come
# with `dialog:default` and none of them has a caller.
tauri-plugin-dialog = "2"
# The updater (#299): the app's second network client, beside the pilot. It
# fetches one public file - `latest.json` from the GitHub release - and, when a
# person presses Update & restart, the bundle it names, verified against the
# minisign key in `tauri.conf.json` before anything is installed. It is driven
# from Rust behind `update_check` and `update_install`; the window is granted no
# updater permission and has no network access of its own. Pinned to a minor
# because the plugin warns that its reqwest client moves with minors, and to
# 2.12 because 2.13 requires tauri 2.12, which would move the whole tauri stack
# (and the `@tauri-apps/api` it must match) for no reason of this change.
tauri-plugin-updater = "~2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The OS keychain for the pilot's credentials (#143): Windows Credential
# Manager, macOS Keychain, the Secret Service on Linux. `apple-native` and
# `windows-native` are the platform stores themselves rather than a file-backed
# fallback - a fallback would put the key on disk, which is the one thing this
# dependency exists to avoid.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
ureq = { version = "3.2.1", default-features = false, features = ["rustls", "json"] }

# The device key and the endpoint id a phone dials (#341). The same crate
# `iroh` 1.3 uses for its `SecretKey` and `PublicKey`, so the endpoint #342
# adds takes this key with no conversion. `key` is the feature carrying the
# ed25519 types; the default is only the relay URL type. Its cost is
# ed25519-dalek 3, curve25519-dalek 5 and rand 0.10 in the build.
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
# The pairing matching code: six digits from a SHA-256 both ends compute
# (#341). Already in the tree via Tauri, so this adds nothing to the build.
sha2 = "0.10"
# The constant-time compare of a pairing secret (#341). Already in the tree.
subtle = "2"
# The pairing QR code as a matrix of modules, which the window draws itself
# (#341). Default features off: no image or svg renderer, because the window
# draws it in token colours and no hex may live outside `tokens.css`.
qrcode = { version = "0.14", default-features = false }
# The OS CSPRNG for the pairing secret and the nonce (#341). Already in the
# tree. A failure refuses the pairing; there is no fallback generator.
getrandom = "0.3"

# One timestamp, in the shape `transcript.log` already uses, so the app's log and
# a run's transcript can be read against each other (#186). Already in the tree
# via Tauri, so this adds nothing to the build; `default-features = false` keeps
# it to the clock and drops the serialisation and localisation nobody here wants.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The job object that makes a killed app take the host with it (#157). Already
# in the tree via Tauri, so this adds nothing to the build; `windows-sys` rather
# than `windows` because three raw calls do not need the safe wrapper's weight.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
] }

# The login shell from the user's account record, when `SHELL` is unset (#272) -
# which is how launchd can start an app on macOS. Already in the tree via Tauri,
# so this adds nothing to the build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
